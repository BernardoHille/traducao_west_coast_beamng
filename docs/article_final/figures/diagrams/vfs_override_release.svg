<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="435" viewBox="0 0 1000 435" font-family="Segoe UI, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2026"/></marker></defs><rect x="270" y="20" width="460" height="70" rx="8" fill="#f3f4f6" stroke="#1c2026" stroke-width="2"/><text x="500.0" y="51.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2026">BeamNG pede um caminho virtual</text><text x="500.0" y="71.0" text-anchor="middle" font-size="13" fill="#4c5560">/assets/materials/signage/roadsigns/t_roadsigns_b.color.dds</text><rect x="270" y="130" width="460" height="64" rx="8" fill="#fff7e8" stroke="#e67814" stroke-width="2"/><text x="500.0" y="158.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2026">Sistema de arquivos virtual (VFS)</text><text x="500.0" y="178.0" text-anchor="middle" font-size="13" fill="#4c5560">monta os zips do jogo e os mods ativos; o mod tem precedência</text><line x1="500" y1="90" x2="500" y2="128" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><line x1="430" y1="194" x2="230" y2="246" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><line x1="570" y1="194" x2="770" y2="246" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="248" width="440" height="120" rx="8" fill="#eaf6ee" stroke="#148c46" stroke-width="2"/><text x="240.0" y="288.4" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2026">MOD ATIVO (1.0.0)</text><text x="240.0" y="308.4" text-anchor="middle" font-size="13" fill="#4c5560">mods/traducao_ptbr_wcusa_v1.0.0.zip</text><text x="240.0" y="325.4" text-anchor="middle" font-size="13" fill="#4c5560">→ assets/.../t_roadsigns_b.color.dds</text><text x="240.0" y="342.4" text-anchor="middle" font-size="13" fill="#4c5560">PARE; 116/116 arquivos de runtime vêm do ZIP</text><rect x="540" y="248" width="440" height="120" rx="8" fill="#fbeaea" stroke="#d62828" stroke-width="2"/><text x="760.0" y="288.4" text-anchor="middle" font-size="17" font-weight="700" fill="#1c2026">MOD DESATIVADO</text><text x="760.0" y="308.4" text-anchor="middle" font-size="13" fill="#4c5560">content/assets/materials/signage.zip</text><text x="760.0" y="325.4" text-anchor="middle" font-size="13" fill="#4c5560">(instalação, só leitura)</text><text x="760.0" y="342.4" text-anchor="middle" font-size="13" fill="#4c5560">STOP; 0/116 vêm do ZIP</text><text x="500" y="400" font-size="13" font-weight="400" fill="#4c5560" text-anchor="middle">Mesmo nome e mesmo caminho: material e malha do jogo não mudam; só a origem do arquivo (MCP file_info → realPath).</text><text x="500" y="420" font-size="13" font-weight="400" fill="#4c5560" text-anchor="middle">Fase 1: pasta unpacked com 1 textura. Fase 9: ZIP de release com 117 arquivos, conferido arquivo a arquivo.</text></svg>
