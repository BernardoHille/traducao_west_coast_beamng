"300" height="70" rx="8" fill="#eef3fb" stroke="#1d63c4" stroke-width="2"/><text x="170.0" y="319.8" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2026">Scripts determinísticos</text><text x="170.0" y="339.8" text-anchor="middle" font-size="12" fill="#4c5560">compose.py, build_*.py,</text><text x="170.0" y="355.8" text-anchor="middle" font-size="12" fill="#4c5560">glyph_rewrite.py, r19_mesh.py</text><line x1="320" y1="331" x2="418" y2="200" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="420" y="150" width="220" height="100" rx="8" fill="#eaf6ee" stroke="#148c46" stroke-width="2"/><text x="530.0" y="188.8" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2026">Asset localizado</text><text x="530.0" y="208.8" text-anchor="middle" font-size="12" fill="#4c5560">PNG → DDS no formato</text><text x="530.0" y="224.8" text-anchor="middle" font-size="12" fill="#4c5560">do original; malha + .cdae</text><line x1="640" y1="200" x2="698" y2="200" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="700" y="120" width="280" height="160" rx="8" fill="#fff7e8" stroke="#e67814" stroke-width="2"/><text x="840.0" y="167.2" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2026">Verificação</text><text x="840.0" y="187.2" text-anchor="middle" font-size="12" fill="#4c5560">0 px fora das regiões</text><text x="840.0" y="203.2" text-anchor="middle" font-size="12" fill="#4c5560">alfa preservado</text><text x="840.0" y="219.2" text-anchor="middle" font-size="12" fill="#4c5560">formato e mips do original</text><text x="840.0" y="235.2" text-anchor="middle" font-size="12" fill="#4c5560">família completa</text><text x="840.0" y="251.2" text-anchor="middle" font-size="12" fill="#4c5560">estrutura da malha idêntica</text><text x="20" y="390" font-size="13" font-weight="400" fill="#4c5560" text-anchor="start">Refazer = rodar de novo. Nenhum pixel é pintado à mão; nenhuma etapa generativa.</text></svg>
