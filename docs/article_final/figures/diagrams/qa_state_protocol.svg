<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" font-family="Segoe UI, Arial, sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2026"/></marker></defs><text x="20" y="28" font-size="16" font-weight="700" fill="#1c2026" text-anchor="start">Protocolo de troca de estado no QA (consolidado nas Fases 5–9)</text><rect x="20" y="50" width="150" height="92" rx="8" fill="#eef3fb" stroke="#1d63c4" stroke-width="2"/><text x="95.0" y="85.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2026">Trocar o mod</text><text x="95.0" y="105.4" text-anchor="middle" font-size="11" fill="#4c5560">core_modmanager:</text><text x="95.0" y="120.4" text-anchor="middle" font-size="11" fill="#4c5560">activate / deactivate</text><line x1="170" y1="96" x2="183" y2="96" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="184" y="50" width="150" height="92" rx="8" fill="#eef3fb" stroke="#1d63c4" stroke-width="2"/><text x="259.0" y="85.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2026">Carregar smallgrid</text><text x="259.0" y="105.4" text-anchor="middle" font-size="11" fill="#4c5560">libera texturas,</text><text x="259.0" y="120.4" text-anchor="middle" font-size="11" fill="#4c5560">shapes e dados</text><line x1="334" y1="96" x2="347" y2="96" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="348" y="50" width="150" height="92" rx="8" fill="#eef3fb" stroke="#1d63c4" stroke-width="2"/><text x="423.0" y="92.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2026">Carregar West Coast</text><text x="423.0" y="112.0" text-anchor="middle" font-size="11" fill="#4c5560">~70–85 s</text><line x1="498" y1="96" x2="511" y2="96" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="512" y="50" width="150" height="92" rx="8" fill="#eaf6ee" stroke="#148c46" stroke-width="2"/><text x="587.0" y="85.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2026">Preset de ambiente</text><text x="587.0" y="105.4" text-anchor="middle" font-size="11" fill="#4c5560">hora, sol fixo,</text><text x="587.0" y="120.4" text-anchor="middle" font-size="11" fill="#4c5560">vento 0, céu limpo</text><line x1="662" y1="96" x2="675" y2="96" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="676" y="50" width="150" height="92" rx="8" fill="#eaf6ee" stroke="#148c46" stroke-width="2"/><text x="751.0" y="85.4" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2026">Câmera do catálogo</text><text x="751.0" y="105.4" text-anchor="middle" font-size="11" fill="#4c5560">pose salva (posição,</text><text x="751.0" y="120.4" text-anchor="middle" font-size="11" fill="#4c5560">quaternion, FOV)</text><line x1="826" y1="96" x2="839" y2="96" stroke="#1c2026" stroke-width="2" marker-end="url(#ah)"/><rect x="840" y="50" width="150" height="92" rx="8" fill="#eaf6ee" stroke="#148c46" stroke-width="2"/><text x="915.0" y="92.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2026">Captura + VFS + log</text><text x="915.0" y="112.0" text-anchor="middle" font-size="11" fill="#4c5560">file_info, get_logs</text><rect x="20" y="172" width="470" height="92" rx="8" fill="#fbeaea" stroke="#d62828" stroke-width="2"/><text x="255.0" y="199.6" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2026">Cache que sobrevive ao mod (Fase 5)</text><text x="255.0" y="219.6" text-anchor="middle" font-size="12" fill="#4c5560">recarregar o MESMO mapa mantém textura e dados;</text><text x="255.0" y="235.6" text-anchor="middle" font-size="12" fill="#4c5560">um .dae mais novo que o .cdae é recompilado em</text><text x="255.0" y="251.6" text-anchor="middle" font-size="12" fill="#4c5560">current/temp e continua valendo com o mod desligado</text><rect x="510" y="172" width="470" height="92" rx="8" fill="#eaf6ee" stroke="#148c46" stroke-width="2"/><text x="745.0" y="199.6" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2026">Resposta adotada</text><text x="745.0" y="219.6" text-anchor="middle" font-size="12" fill="#4c5560">trocar de mapa a cada mudança de estado;</text><text x="745.0" y="235.6" text-anchor="middle" font-size="12" fill="#4c5560">distribuir o .cdae compilado pelo jogo, com data</text><text x="745.0" y="251.6" text-anchor="middle" font-size="12" fill="#4c5560">posterior à do .dae (no ZIP: +2 min)</text></svg>
